version: "3.9"

name: geothermai-explorer

services:

  # ---------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geothermai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - geothermai_network

  # ---------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geothermai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/geothermai
      SECRET_KEY: change_this_before_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      - database
    networks:
      - geothermai_network

  # ---------------------------------------------------------
  # PostgreSQL + PostGIS
  # ---------------------------------------------------------
  database:
    image: postgis/postgis:16-3.4
    container_name: geothermai_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: geothermai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geothermai_network

  # ---------------------------------------------------------
  # PgAdmin
  # ---------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: geothermai_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@geothermai.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - database
    networks:
      - geothermai_network

  # ---------------------------------------------------------
  # AI Engine
  # ---------------------------------------------------------
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: geothermai_ai
    restart: unless-stopped
    volumes:
      - ./ai-engine:/app
    depends_on:
      - backend
    networks:
      - geothermai_network

# ---------------------------------------------------------
# Volumes
# ---------------------------------------------------------

volumes:
  postgres_data:

# ---------------------------------------------------------
# Networks
# ---------------------------------------------------------

networks:
  geothermai_network:
    driver: bridge