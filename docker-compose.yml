version: "3.9"

services:

  frontend:
    build:
      context: ./frontend
    container_name: geothermai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - geothermai_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    container_name: geothermai-backend
    ports:
      - "8000:8000"
    depends_on:
      - database
    networks:
      - geothermai_network
    environment:
      DATABASE_URL: postgresql://geothermai:geothermai@database:5432/geothermai

  database:
    image: docker.io/postgis/postgis:16-3.4
    container_name: geothermai-database
    environment:
      POSTGRES_DB: geothermai
      POSTGRES_USER: geothermai
      POSTGRES_PASSWORD: geothermai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geothermai_network

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: geothermai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@geothermai.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - database
    networks:
      - geothermai_network

  ai-engine:
    build:
      context: ./ai-engine
    container_name: geothermai-ai-engine
    ports:
      - "8001:8001"
    networks:
      - geothermai_network

volumes:
  postgres_data:

networks:
  geothermai_network:
    driver: bridge